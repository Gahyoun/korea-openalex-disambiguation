[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "korea-openalex-disambiguation"
version = "0.1.0"
description = "Reproducible career-aware OpenAlex author disambiguation for Korean faculty rosters"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Gahyoun Kim"}]
keywords = ["OpenAlex", "author-disambiguation", "bibliometrics", "Korea"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
koad = "koad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

